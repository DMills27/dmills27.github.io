# Site settings
title:          Tale
description:    "Minimal Jekyll theme for storytellers"
url:            "https://chesterhow.github.io"

# Google Analytics
google_analytics: UA—XXXXXXXX-X

# Author
author:
  name:         Chester How
  url:          https://chester.how
  email:        chesterhow@gmail.com

# Build settings
markdown:       kramdown
highlighter:    none
kramdown:
  footnote_nr: 1
  input: GFM
  syntax_highlighter: none
  
include:
  - _pages

exclude:
  - gemset.nix
  - flake.nix
  - flake.lock

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# BibTeX / CSL citation support (_plugins/bibtex.rb)
# bibliography: path to the .bib file, relative to the site root
# style:        built-in CSL style name (apa, ieee, chicago-author-date, …)
#               browse full list at https://www.zotero.org/styles
# csl:          (optional) path to a custom .csl file; takes precedence over style:
bibtex:
  bibliography: _bib/bibliography.bib
  style:        apa

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec, anime, "untitled folder", dark-mode-toggle.mjs ]

# Disqus (Set to your disqus id)
disqus:         jekyll-tale