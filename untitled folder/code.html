<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Highlighted Code with Gutter</title>

<!-- Highlight.js -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/default.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/go.min.js"></script>

<style>
  :root {
    --code-bg: #f6f8fa;
    --text: #24292f;
    --line-number: #9aa0a6;
    --divider: #d0d7de;
  }

  body {
    margin: 40px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  pre.code {
    position: relative;
    background: var(--code-bg);
    border-radius: 6px;
    padding: 0;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 14px;
    line-height: 1.4; /* slightly tighter */
    counter-reset: line;
  }

  /* Full-height dashed line — positioned tightly */
  pre.code::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 2.25em; /* reduced from 3.75em */
    border-left: 1px dashed var(--divider);
    pointer-events: none;
    z-index: 1;
  }

  pre.code code {
    display: block;
    color: var(--text);
  }

  .code-line {
    display: block;
    position: relative;
    padding: 10px 1em 10px 2.75em; /* reduced left padding */
    white-space: pre;
    margin: 0;
  }

  /* Line numbers — compact */
  .code-line::before {
    counter-increment: line;
    content: counter(line);
    position: absolute;
    left: 0;
    width: 2.1em; /* reduced width */
    text-align: right;
    color: var(--line-number);
    padding-right: 0.3em; /* minimal gap before divider */
    font-size: 13px;
    top: 10px;
    user-select: none;
  }

  .code-line:empty::after {
    content: "\00a0";
  }

  .language-badge {
    position: absolute;
    top: 0;
    right: 0;
    margin: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: #57606a;
    background: #ffffff;
    border: 1px solid #d0d7de;
    border-radius: 3px;
    text-transform: lowercase;
    user-select: none;
    z-index: 2;
  }
</style>
</head>

<body>

<pre class="code"><code class="language-go">
module Main (main) where         

main :: IO ()                     
main = putStrLn "Hello, World!"
</code></pre>

<script>
  document.querySelectorAll('pre.code').forEach(pre => {
    const code = pre.querySelector('code');

    const raw = code.textContent.replace(/\n$/, '');

    // 1. Autodetect language
    const detection = hljs.highlightAuto(raw);
    const language = detection.language || 'text';

    // 2. Add language badge
    const badge = document.createElement('div');
    badge.className = 'language-badge';
    badge.textContent = language;
    pre.appendChild(badge);

    // 3. Render line-by-line
    const lines = raw.split('\n');
    code.innerHTML = '';

    lines.forEach(line => {
      const span = document.createElement('span');
      span.className = 'code-line';

      if (line.trim() === '') {
        span.innerHTML = '&nbsp;';
      } else {
        span.innerHTML = hljs.highlight(line, { language }).value;
      }

      code.appendChild(span);
    });
  });
</script>

</body>
</html>
