<!-- comments.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inline Comments – Double-Click Safe</title>

<style>
:root {
  --color-bg: #ffffff;
  --color-fg: #1d1d1f;
  --color-secondary: #86868b;
  --color-border: #d2d2d7;
  --color-highlight: #007aff20;
  --color-highlight-border: #007aff66;
  --color-button-default: #007aff66;
  --color-button-active: #007aff;
  --comment-bg: #ffffff;
  --shadow-tooltip: 0 8px 24px rgba(0, 0, 0, 0.12);
  --radius-lg: 16px;
  --spacing-sm: 0.5rem;
  --spacing-md: 0.75rem;
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #1c1c1e;
    --color-fg: #f5f5f7;
    --color-secondary: #98989d;
    --color-border: #424245;
    --comment-bg: #2c2c2e;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  color: var(--color-fg);
  background-color: var(--color-bg);
  padding: 3rem;
  max-width: 720px;
  margin: 0 auto;
  position: relative;
}

p {
  font-size: 1.05rem;
}

.annotation {
  position: relative;
  background-color: var(--color-highlight);
  border-bottom: 2px solid var(--color-highlight-border);
  border-radius: 4px;
  cursor: pointer;
  padding: 0.1em 0.15em;
}

.annotation .bubble {
  position: absolute;
  top: -1.2em;
  right: -0.2em;
  font-size: 0.8rem;
  opacity: 0;
  transition: opacity 0.15s ease;
  pointer-events: none;
}

.annotation:hover .bubble {
  opacity: 1;
}

.tooltip {
  position: fixed;
  min-width: 260px;
  background: var(--comment-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-md);
  box-shadow: var(--shadow-tooltip);
  z-index: 1000;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.comment {
  display: flex;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-sm);
  font-size: 15px;
}

.avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 600;
  color: white;
  flex-shrink: 0;
}

.comment-author {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 2px;
}

.comment-text {
  font-size: 14px;
  color: var(--color-secondary);
}

.comment-input {
  width: 100%;
  margin-top: var(--spacing-md);
  padding: 0.35rem 0.5rem;
  border: 1px solid var(--color-border);
  border-radius: 8px;
  background: transparent;
  color: var(--color-fg);
  font: inherit;
  resize: none;
  box-sizing: border-box;
}

.comment-post-btn {
  margin-top: 0.4rem;
  padding: 0.35rem 0.8rem;
  background: var(--color-button-default);
  color: white;
  border: none;
  border-radius: 8px;
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s ease;
}

.comment-post-btn:enabled {
  background: var(--color-button-active);
}

.comment-post-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>
</head>

<body>

<p id="content">
  Highlight any part of this paragraph to add comments. Double-clicking will no longer break the UI.
  If you close the comment box without posting, the highlight disappears cleanly.
  Try selecting text that contains <em>emphasis</em> or <strong>bold</strong> — the formatting survives.
</p>

<script>
const annotations = new Map();
let activeTooltip = null;
let activeAnnotation = null;
let isProcessingSelection = false;

const user = (() => {
  const names = ["Alex", "Sam", "Jordan", "Taylor", "Morgan"];
  const name = names[Math.floor(Math.random() * names.length)];
  const color = `hsl(${Math.random() * 360}, 70%, 50%)`;
  return { name, color };
})();

// ── Escape user text before inserting into innerHTML ──────────────────────
// FIX #5 (XSS): never trust user-supplied text in innerHTML.
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function isRangeWrapSafe(range) {
  if (!range || range.collapsed) return false;

  const contentEl = document.getElementById("content");

  // FIX #18: `contains()` works on text nodes in all modern browsers, but
  // walking to the nearest Element first is more explicit and reliable.
  let commonAncestor = range.commonAncestorContainer;
  if (commonAncestor.nodeType === Node.TEXT_NODE) {
    commonAncestor = commonAncestor.parentElement;
  }
  if (!contentEl.contains(commonAncestor)) return false;

  // Must contain actual (non-whitespace) text.
  if (!range.toString().trim()) return false;

  // FIX #4: check live DOM ancestors for an existing .annotation.
  // cloneContents() only sees elements *inside* the range, so a selection
  // that is entirely within an annotation span yields a fragment of plain
  // text nodes — the containing span is invisible to the walker.
  // Checking the ancestor chain catches fully-contained sub-selections.
  let ancestor = range.commonAncestorContainer;
  while (ancestor && ancestor !== contentEl) {
    if (ancestor.classList?.contains('annotation')) return false;
    if (ancestor.classList?.contains('tooltip'))    return false;
    ancestor = ancestor.parentNode;
  }

  // Must not cross block-level elements or span existing annotations
  // (handles partial overlaps where the annotation span IS inside the range).
  const contents = range.cloneContents();
  const walker = document.createTreeWalker(contents, NodeFilter.SHOW_ELEMENT);
  let node;
  while ((node = walker.nextNode())) {
    if (node.classList?.contains('annotation') ||
        ['DIV', 'P', 'H1', 'H2', 'BLOCKQUOTE'].includes(node.nodeName)) {
      return false;
    }
  }
  return true;
}

document.addEventListener("mouseup", () => {
  if (isProcessingSelection) return;

  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;

  const range = sel.getRangeAt(0);
  if (!isRangeWrapSafe(range)) {
    sel.removeAllRanges();
    return;
  }

  // FIX #7: set the lock synchronously — not via setTimeout — so there is no
  // window between the check above and the DOM work below.
  isProcessingSelection = true;

  const wrapper = document.createElement("span");
  wrapper.className = "annotation";
  wrapper.dataset.id = crypto.randomUUID();

  const bubble = document.createElement("span");
  bubble.className = "bubble";
  bubble.textContent = "💬";
  bubble.setAttribute("aria-hidden", "true");

  try {
    // FIX #14: validate BEFORE extracting so the DOM isn't left in a broken
    // state if the selection turns out to be empty after cloning.
    const previewText = range.cloneContents().textContent.trim();
    if (!previewText) throw new Error("Empty selection");

    // Now it is safe to mutate the DOM.
    const safeRange = range.cloneRange();
    const fragment  = safeRange.extractContents();

    wrapper.appendChild(fragment);
    wrapper.appendChild(bubble);
    safeRange.insertNode(wrapper);
    sel.removeAllRanges();

    annotations.set(wrapper.dataset.id, {
      element:   wrapper,
      comments:  [],
      committed: false,
    });

    wrapper.addEventListener("click", (e) => {
      e.stopPropagation();
      openTooltip(wrapper);
    });

  } catch (e) {
    console.warn("Failed to create annotation", e);
    if (wrapper.parentNode) wrapper.remove();
  } finally {
    // FIX #7 (continued): release immediately now that all synchronous DOM
    // work is done. The tiny async gap between two rapid mouseup events
    // is irrelevant because the second event fires on the *next* mouseup.
    isProcessingSelection = false;
  }
});

function openTooltip(annotationEl) {
  closeTooltip();

  const tooltip = document.createElement("div");
  tooltip.className = "tooltip";
  tooltip.dataset.annotationId = annotationEl.dataset.id;

  // FIX #1: tooltip is `position: fixed`, so coordinates are already
  // viewport-relative. Do NOT add window.scrollY / window.scrollX.
  const rect = annotationEl.getBoundingClientRect();
  tooltip.style.top  = `${rect.bottom + 6}px`;
  tooltip.style.left = `${rect.left}px`;

  renderComments(tooltip);
  document.body.appendChild(tooltip);

  // FIX #6: clamp to viewport after the browser has laid out the tooltip
  // so we can read its actual rendered dimensions.
  requestAnimationFrame(() => {
    const tr = tooltip.getBoundingClientRect();
    if (tr.right > window.innerWidth - 8) {
      tooltip.style.left = `${Math.max(8, window.innerWidth - tr.width - 8)}px`;
    }
    if (tr.bottom > window.innerHeight - 8) {
      // Flip above the annotation if it overflows the bottom.
      tooltip.style.top = `${rect.top - tr.height - 6}px`;
    }
  });

  activeTooltip    = tooltip;
  activeAnnotation = annotationEl;
}

// FIX #9: keep the tooltip anchored to the annotation while the page scrolls.
function repositionTooltip() {
  if (!activeTooltip || !activeAnnotation) return;
  const rect = activeAnnotation.getBoundingClientRect();
  activeTooltip.style.top  = `${rect.bottom + 6}px`;
  activeTooltip.style.left = `${rect.left}px`;

  // Re-clamp after moving.
  const tr = activeTooltip.getBoundingClientRect();
  if (tr.right > window.innerWidth - 8) {
    activeTooltip.style.left = `${Math.max(8, window.innerWidth - tr.width - 8)}px`;
  }
  if (tr.bottom > window.innerHeight - 8) {
    activeTooltip.style.top = `${rect.top - tr.height - 6}px`;
  }
}

document.addEventListener("scroll", repositionTooltip, { passive: true });
window.addEventListener("resize", repositionTooltip);

function renderComments(tooltip) {
  tooltip.innerHTML = "";
  const id    = tooltip.dataset.annotationId;
  const entry = annotations.get(id);
  if (!entry) return;

  entry.comments.forEach(c => {
    const div = document.createElement("div");
    div.className = "comment";

    // FIX #5 (XSS): build DOM nodes instead of concatenating HTML strings
    // so user-supplied text is never interpreted as markup.
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    // FIX #4 (CSS injection): use style.backgroundColor instead of
    // injecting c.color directly into an HTML string.
    avatar.style.backgroundColor = c.color;
    avatar.textContent = c.initial;

    const body = document.createElement("div");

    const author = document.createElement("div");
    author.className = "comment-author";
    author.textContent = c.author; // textContent — safe

    const text = document.createElement("div");
    text.className = "comment-text";
    text.textContent = c.text; // textContent — safe

    body.append(author, text);
    div.append(avatar, body);
    tooltip.appendChild(div);
  });

  const textarea = document.createElement("textarea");
  textarea.className = "comment-input";
  textarea.rows = 2;
  textarea.placeholder = "Add a comment…";

  const btn = document.createElement("button");
  btn.className = "comment-post-btn";
  btn.textContent = "Post";
  btn.disabled = true;

  textarea.addEventListener("input", () => {
    btn.disabled = !textarea.value.trim();
  });

  // FIX #10: Ctrl/Cmd+Enter submits the comment.
  textarea.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !btn.disabled) {
      btn.click();
    }
  });

  btn.addEventListener("click", () => {
    if (!textarea.value.trim()) return;
    entry.comments.push({
      author:  user.name,
      initial: user.name[0].toUpperCase(),
      color:   user.color,
      text:    textarea.value.trim(),
    });
    entry.committed = true;
    renderComments(tooltip);
  });

  tooltip.appendChild(textarea);
  tooltip.appendChild(btn);
  setTimeout(() => textarea.focus({ preventScroll: true }), 10);
}

function closeTooltip() {
  if (!activeTooltip || !activeAnnotation) return;

  const id    = activeTooltip.dataset.annotationId;
  const entry = annotations.get(id);

  if (entry && entry.comments.length === 0 && !entry.committed) {
    const wrapper = entry.element;
    const parent  = wrapper.parentNode;
    if (parent) {
      // FIX #1/#8: restore the original child nodes (preserving inline
      // elements like <em> and <strong>) instead of flattening to plain text.
      // We move every child except the bubble back to the parent.
      const frag = document.createDocumentFragment();
      for (const child of [...wrapper.childNodes]) {
        if (!child.classList?.contains('bubble')) frag.appendChild(child);
      }
      parent.replaceChild(frag, wrapper);
    }
    annotations.delete(id);
  }

  if (activeTooltip.parentNode) activeTooltip.remove();
  activeTooltip    = null;
  activeAnnotation = null;
}

// FIX #2: also guard against clicks *inside* the tooltip — the previous
// check only excluded clicks on .annotation, so typing in the textarea
// or clicking "Post" would immediately close the tooltip.
document.addEventListener("click", (e) => {
  if (!e.target.closest(".annotation") && !e.target.closest(".tooltip")) {
    closeTooltip();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeTooltip();
});
</script>

</body>
</html>
